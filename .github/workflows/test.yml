name: Test

# The examples and fixtures are checked against the compiler the playground
# ships with: deploy.yml runs `cargo update almide` against almide's main
# branch, so this job builds the almide CLI at main's current head. (A release
# merge reaches main before its tag exists, so "the newest tag" can lag behind
# what the deploy compiles with.) tests/run.mjs runs every fixture and every
# example on native, on the CLI's wasm route, and on the incumbent renderer
# the playground itself uses.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve almide main's head
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/almide/almide.git refs/heads/main | cut -f1)
          test -n "$sha"
          echo "almide main $sha"
          echo "ALMIDE_SHA=$sha" >> "$GITHUB_ENV"

      - name: Cache the almide build
        id: almide-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/almide-main
          key: almide-main-${{ env.ALMIDE_SHA }}

      - name: Install Rust
        if: steps.almide-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Build almide at main's head
        if: steps.almide-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/almide/almide.git --rev "$ALMIDE_SHA" --root "$HOME/.local/almide-main" almide

      - name: Put almide on PATH
        run: |
          echo "$HOME/.local/almide-main/bin" >> "$GITHUB_PATH"
          "$HOME/.local/almide-main/bin/almide" --version

      - name: Install wasmtime (the CLI's wasm leg runs on it)
        run: |
          set -euo pipefail
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Run fixtures and examples on every leg
        run: ALMIDE_BIN="$HOME/.local/almide-main/bin/almide" node tests/run.mjs
