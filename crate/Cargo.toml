[package]
name = "almide-playground"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
almide = { git = "https://github.com/almide/almide.git", branch = "main" }
# The v0 wasm emitter was retired (almide#782): `almide::codegen::codegen(_,
# Target::Wasm)` now hits an honest `unreachable!()` instead of emitting code.
# The only live wasm codegen path is the v1 trust-spine renderer, exposed by
# almide-mir directly (the SAME entry the native CLI's `--target wasm` and
# almide's own browser-ABI determinism harness — tools/wasmgen-harness-uu —
# use). almide keeps almide-mir as a normal path dep of its own workspace, so
# pulling the SAME git rev here (not a separate resolution) keeps the two in
# lockstep.
almide-mir = { git = "https://github.com/almide/almide.git", branch = "main" }
wat = "1"

# Size-first release profile: the wasm ships to every first-time visitor
# (10MB → the dominant cost of the playground's initial load). `z` + fat LTO
# + single codegen unit trades compile-farm minutes and some runtime speed
# for download size; in-browser compile latency stays well under a second.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
# Overriding wasm-opt args drops wasm-pack's defaults, so the feature flags
# rustc-emitted wasm needs (bulk memory etc.) must be re-enabled explicitly.
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-sign-ext", "--enable-mutable-globals", "--enable-nontrapping-float-to-int"]
